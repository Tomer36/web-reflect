# Builds the static site and uploads out/ to the hosting over FTP.
# Runs on every push to main, or by hand from the Actions tab.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER      FTP host, e.g. ftp.web-reflect.com or the server IP
#   FTP_USERNAME    FTP user
#   FTP_PASSWORD    FTP password
#   FTP_SERVER_DIR  optional, folder the site goes into, relative to where the
#                   FTP login lands (default: ./ — a Hostinger FTP login already
#                   opens inside public_html)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Same npm as local development: npm 12 rejects this lock file
      # (it wants peer deps of a bundled wasm package listed separately).
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run lint
      # check:i18n → images → next build → check:pages; any failure stops the deploy
      - run: npm run build

      # Shared hosting FTP sometimes drops the connection (ECONNRESET), so a
      # failed upload is retried once. The sync state is only written after a
      # complete upload, so the retry picks up whatever was not sent.
      - name: Upload to hosting
        id: upload
        if: env.FTP_SERVER != ''
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}

      - name: Upload to hosting (retry)
        if: steps.upload.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}

      - name: FTP secrets missing
        if: env.FTP_SERVER == ''
        run: echo "::warning::FTP_SERVER secret is not set — the site was built but not uploaded."
